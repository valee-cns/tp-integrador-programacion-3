<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida | LV - Loot Valley</title>
    <link rel="stylesheet" href="/css/productos.css">
    <link rel="stylesheet" href="/css/tema.css">
    <script src="/js/tema.js"></script>
</head>
<body>
    <header>
        <h1>LV - Loot Valley</h1>
        <p>Trabajo de Valen y Lian — Programación III</p>
        <nav>
            <a href="/admin/login">Administración</a>
            <button type="button" id="cambiar-tema">Cambiar tema</button>
        </nav>

    <main>
        <h2>¡Bienvenido a Loot Valley!</h2>

        <form id="formulario-bienvenida">

            <input
                type="text"
                id="nombre-cliente"
                name="nombre"
                required
            >
            <button type="submit">Continuar</button>
        </form>
    </main>
    <script src="/js/bienvenida.js"></script>
