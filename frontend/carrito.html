<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | LV - Loot Valley</title>
    <link rel="stylesheet" href="/css/productos.css">
    <link rel="stylesheet" href="/css/tema.css">
    <script src="/js/tema.js"></script>
    <link rel="icon" href="/img/logo-loot-valley.png" type="image/png">
</head>
<body class="pagina-carrito">
    <header class="cabecera-bienvenida">
        <div class="marca-bienvenida">
            <img src="/img/logo-loot-valley.png" alt="" width="80" height="80">
            <div class="texto-marca-bienvenida">
                <h1>LV - Loot Valley</h1>
                <p>Valentina Cisneros y Lian Giaccone — Programación III</p>
            </div>
        </div>

        <nav class="acciones-bienvenida">
            <button type="button" id="cambiar-tema">Cambiar tema</button>
        </nav>
    </header>

    <main class="contenido-carrito">
        <h2>Tu carrito</h2>
        <p id="mensaje-carrito" role="status"></p>

        <div class="distribucion-carrito">
            <section id="lista-carrito" aria-label="Productos seleccionados"></section>

            <section class="resumen-carrito" aria-labelledby="titulo-resumen-carrito">
                <h3 id="titulo-resumen-carrito">Resumen de la compra</h3>
                <ul id="detalle-resumen-carrito"></ul>
                <p>Total: <strong id="total-carrito"></strong></p>
                <button id="finalizar-compra" type="button">Finalizar compra</button>
            </section>

            <a class="boton-enlace seguir-comprando" href="/productos.html">Seguir comprando</a>
        </div>

        <dialog id="confirmacion-compra" aria-labelledby="titulo-confirmacion">
            <h2 id="titulo-confirmacion">Confirmar compra</h2>
            
            <p>¿Querés confirmar los productos de tu carrito?</p>
            <p id="error-compra" role="alert"></p>

            <button id="cancelar-compra" type="button">Cancelar</button>
            <button id="confirmar-compra" type="button">Confirmar compra</button>
        </dialog>
    </main>

    <script src="/js/carrito.js"></script>
    <script src="/js/pantallaCarrito.js"></script>
</body>
</html>
