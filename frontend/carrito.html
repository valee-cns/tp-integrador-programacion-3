<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito | LV - Loot Valley</title>
    <link rel="stylesheet" href="/css/productos.css">
    <link rel="stylesheet" href="/css/tema.css">
    <script src="/js/tema.js"></script>
</head>
<body>
    <header>
        <h1>LV - Loot Valley</h1>
        <p>Trabajo de Valen y Lian — Programación III</p>

        <nav>
            <a href="/productos.html">Seguir comprando</a>
            <button type="button" id="cambiar-tema">Cambiar tema</button>
        </nav>
    </header>

    <main>
        <h2>Tu carrito</h2>
        <p id="cliente-carrito"></p>
        <p id="mensaje-carrito" role="status"></p>

        <section
            id="lista-carrito"
            aria-label="Productos seleccionados"
        ></section>

        <p>Total: <strong id="total-carrito"></strong></p>

        <button id="finalizar-compra" type="button">Finalizar compra</button>

        <dialog id="confirmacion-compra" aria-labelledby="titulo-confirmacion">
            <h2 id="titulo-confirmacion">Confirmar compra</h2>
            
            <p>¿Querés confirmar los productos de tu carrito?</p>
            <p id="error-compra" role="alert"></p>

            <button id="cancelar-compra" type="button">Cancelar</button>
            <button id="confirmar-compra" type="button">Confirmar compra</button>
        </dialog>
    </main>

    <script src="/js/carrito.js"></script>
    <script src="/js/pantallaCarrito.js"></script>
</body>
</html>
