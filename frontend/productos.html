<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos | LV - Loot Valley</title>
    <link rel="stylesheet" href="/css/productos.css">
    <link rel="stylesheet" href="/css/tema.css">
    <script src="/js/tema.js"></script>
    <link rel="icon" href="/img/logo-loot-valley.png" type="image/png">
</head>
<body class="pagina-catalogo">
    <header class="cabecera-bienvenida">
        <div class="marca-bienvenida">
            <img src="/img/logo-loot-valley.png" alt="" width="80" height="80">
            <div class="texto-marca-bienvenida">
                <h1>LV - Loot Valley</h1>
                <p>Valentina Cisneros y Lian Giaccone — Programación III</p>
            </div>
        </div>

        <nav class="acciones-bienvenida">
            <a class="boton-enlace" href="/">Volver a bienvenida</a>
            <a class="boton-enlace" href="/carrito.html">Ver carrito</a>
            <button type="button" id="cambiar-tema">Cambiar tema</button>
        </nav>
    </header>

    <main class="contenido-catalogo">
        <h2>Catálogo</h2>

        <p id="saludo-cliente"></p>
        <p>
            Unidades en el carrito:
            <span id="cantidad-carrito">0</span>
        </p>

        <div class="filtros-catalogo">
            <div class="filtro-categoria">
                <label for="categoria">Categoría:</label>
                <select id="categoria" disabled>
                    <option value="">Todas</option>
                </select>
            </div>

            <form id="formulario-busqueda" class="filtros-panel" role="search">
                <label for="buscar-producto">Nombre del producto:</label>
                <input id="buscar-producto" type="search" maxlength="100" placeholder="Buscar producto...">
                <button type="submit">Buscar</button>
            </form>
        </div>
        <p id="mensaje" role="status"></p>

        <section id="productos" aria-label="Productos disponibles"></section>

        <div class="paginacion">
            <button id="anterior" type="button" disabled>Anterior</button>
            <span id="info-pagina"></span>
            <button id="siguiente" type="button" disabled>Siguiente</button>
        </div>
    </main>

    <script src="/js/carrito.js"></script>
    <script src="/js/productos.js"></script>
</body>
</html>
